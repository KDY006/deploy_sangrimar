# Cong dich vu (tu dong nhan bien PORT tu Render/Railway, mac dinh 8080)
server.port=${PORT:8080}

# Ket noi CSDL MySQL (Uu tien doc tu Bien Moi Truong tren Cloud, fallback ve Localhost XAMPP)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quanly_cafe?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cau hinh JPA / Hibernate ORM (Chuan v2.0 giu nguyen DDL tu database_mau.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cau hinh phuc vu Static Web (HTML5/Bootstrap 5 trong static/)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Cau hinh UTF-8 tieng Viet
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Cau hinh Jackson JSON tranh loi Infinite Recursion khi serialize Entity
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
